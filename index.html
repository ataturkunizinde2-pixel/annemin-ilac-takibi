<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4fcf"><link rel="manifest" href="manifest.json"><title>Annemin İlaç Takibi</title><style>
body{font-family:system-ui;margin:0;background:#f6f5fb;color:#222}.w{max-width:720px;margin:auto;padding:16px 14px 70px}header{background:#5b4fcf;color:#fff;padding:22px;border-radius:20px}h1{margin:0;font-size:27px}.bar{margin:14px 0}button{border:0;border-radius:12px;padding:10px 12px;font-weight:700}.p{background:#5b4fcf;color:#fff}.s{background:#eee}.c{background:#fff;border-radius:17px;padding:14px;margin:10px 0;border-left:6px solid #777;box-shadow:0 3px 12px #0001}.now{border-color:#299653}.soon{border-color:#e39a13}.off{opacity:.55}.r{display:flex;justify-content:space-between;gap:8px}.n{font-size:18px;font-weight:800}.t{font-size:11px;font-weight:800;background:#eee;padding:5px 7px;border-radius:20px;height:max-content}.now .t{background:#dcf4e4;color:#176c39}.soon .t{background:#fff0c9;color:#805400}.m{font-size:14px;color:#666;line-height:1.55;margin-top:7px}.a{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}dialog{border:0;border-radius:18px;width:min(90vw,500px)}label{display:block;font-size:13px;font-weight:700;margin-top:9px}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;box-sizing:border-box}.ck{width:auto}
</style></head><body><div class=w><header><h1>💊 Annemin İlaç Takibi</h1><div>Reçete tarihleri ve ilaç stoğu</div></header><div class=bar><button class=p onclick="add()">+ İlaç Ekle</button></div><main id=list></main></div>
<dialog id=d><h2 id=dt>İlaç</h2><input type=hidden id=e><label>İlaç adı</label><input id=nm><label>Kutu içeriği (adet)</label><input id=pk type=number><label>Mevcut stok (adet)</label><input id=st type=number><label>Günlük kullanım</label><input id=dy type=number step=.5 placeholder="Bilinmiyorsa boş bırak"><label>Takip / reçete tarihi</label><input id=rx type=date><label><input class=ck id=cr type=checkbox> Şimdi reçete yazdırılabilir (+)</label><label><input class=ck id=ac type=checkbox checked> Aktif</label><div class=a><button class=p onclick="save()">Kaydet</button><button class=s onclick="d.close()">Vazgeç</button></div></dialog>
<script>
const K='anne-ilac-v5',S=[
[1,'Tardyferon 80 mg',null,'',1],[2,'Feramat 100 mg',30,'2026-10-11',0],[3,'Levotiron 125 mcg',50,'',1],[4,'Nexium 40 mg',28,'',1],[5,'Glifor 1000 mg',100,'',1],[6,'Fludex SR',null,'',1],[7,'Beloc ZOK 50 mg',20,'2026-10-23',0],[8,'Lixiana 30 mg',28,'2026-12-17',0],[9,'Duloxx 30 mg',28,'',1],[10,'Zentius D',60,'',1],[11,'Panto 40 mg',28,'',0]
].map(x=>({id:x[0],name:x[1],pack:x[2],rx:x[3],can:!!x[4],stock:null,daily:null,active:x[0]!=11}));
let M=JSON.parse(localStorage.getItem(K)||'null')||S;
const $=x=>document.getElementById(x);function fd(s){return s?new Date(s+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):''}function dd(s){if(!s)return null;let a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(s+'T00:00')-a)/86400000)}
function status(m){if(!m.active)return['off','Pasif'];if(m.can)return['now','ŞİMDİ YAZDIRILABİLİR'];let q=dd(m.rx);if(q!==null&&q<=14)return['soon',q<=0?'TARİHİ GELDİ':q+' GÜN KALDI'];return['','Takipte']}
function render(){let list=document.getElementById('list');list.innerHTML='';M.forEach(m=>{let z=status(m),b=m.stock!=null&&m.daily?new Date(Date.now()+Math.floor(m.stock/m.daily)*86400000).toLocaleDateString('tr-TR'):'';list.insertAdjacentHTML('beforeend',`<section class="c ${z[0]}"><div class=r><div class=n>${m.name}</div><span class=t>${z[1]}</span></div><div class=m>${m.pack?'Kutu: '+m.pack+' adet<br>':''}${m.rx?'Reçete/takip: <b>'+fd(m.rx)+'</b><br>':''}${m.stock==null?'Stok: henüz girilmedi':'Stok: <b>'+m.stock+'</b> adet'}<br>${m.daily?'Günlük: '+m.daily+(b?' · Tahmini bitiş: <b>'+b+'</b>':''):'Günlük kullanım: henüz girilmedi'}</div><div class=a><button class=p onclick="buy(${m.id})">İlaç aldım</button><button class=s onclick="edit(${m.id})">Düzenle</button><button class=s onclick="tog(${m.id})">${m.active?'Pasife al':'Aktif et'}</button></div></section>`)})}
function add(){e.value='';nm.value='';pk.value='';st.value='';dy.value='';rx.value='';cr.checked=false;ac.checked=true;dt.textContent='Yeni ilaç';d.showModal()}function edit(id){let m=M.find(x=>x.id==id);e.value=id;nm.value=m.name;pk.value=m.pack??'';st.value=m.stock??'';dy.value=m.daily??'';rx.value=m.rx;cr.checked=m.can;ac.checked=m.active;dt.textContent='İlacı düzenle';d.showModal()}
function save(){if(!nm.value.trim())return;let id=+e.value||Date.now(),o={id,name:nm.value.trim(),pack:pk.value?+pk.value:null,stock:st.value?+st.value:null,daily:dy.value?+dy.value:null,rx:rx.value,can:cr.checked,active:ac.checked},i=M.findIndex(x=>x.id==id);i<0?M.push(o):M[i]=o;go();d.close()}function buy(id){let m=M.find(x=>x.id==id),n=+prompt('Kaç kutu aldın?','1');if(!n)return;let p=m.pack||+prompt('Bir kutuda kaç adet var?','');if(!p)return;m.pack=p;m.stock=(m.stock||0)+n*p;m.can=false;go()}function tog(id){let m=M.find(x=>x.id==id);m.active=!m.active;go()}function go(){localStorage.setItem(K,JSON.stringify(M));render()}render();
</script></body></html>
